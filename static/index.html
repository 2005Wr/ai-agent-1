<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企业智能 Agent 助手</title>
<style>
  :root {
    --primary: #2563eb;
    --primary-2: #7c3aed;
    --bg: #eef2f9;
    --card: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --user-bubble: linear-gradient(135deg, #2563eb, #4f46e5);
    --ai-bubble: #ffffff;
    --border: #e5e7eb;
    --danger: #ef4444;
    --radius: 18px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100%;
  }

  /* ===== 顶部导航 ===== */
  header {
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    color: #fff;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 12px rgba(37, 99, 235, .25);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand .logo {
    width: 38px; height: 38px; border-radius: 10px;
    background: rgba(255,255,255,.2);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }
  .brand h1 { font-size: 17px; font-weight: 600; }
  .brand p { font-size: 12px; opacity: .85; }

  header .actions { display: flex; gap: 8px; align-items: center; }
  .btn {
    border: none; cursor: pointer; font-size: 13px;
    border-radius: 8px; padding: 8px 14px;
    background: rgba(255,255,255,.18); color: #fff;
    transition: background .2s;
  }
  .btn:hover { background: rgba(255,255,255,.32); }

  /* ===== 聊天主体 ===== */
  main {
    flex: 1; overflow-y: auto;
    padding: 20px 16px 12px;
    scroll-behavior: smooth;
  }
  .chat-wrap { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

  .msg { display: flex; gap: 10px; max-width: 100%; }
  .msg .avatar {
    width: 36px; height: 36px; border-radius: 50%;
    flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    font-size: 17px; margin-top: 2px;
  }
  .msg.user { flex-direction: row-reverse; }
  .msg.user .avatar { background: linear-gradient(135deg, #4f46e5, #2563eb); }
  .msg.ai .avatar { background: #fff; border: 1px solid var(--border); box-shadow: 0 1px 4px rgba(0,0,0,.06); }

  .bubble {
    max-width: 76%;
    padding: 11px 15px;
    border-radius: var(--radius);
    font-size: 14.5px; line-height: 1.65; word-break: break-word;
  }
  .msg.user .bubble {
    background: var(--user-bubble); color: #fff;
    border-bottom-right-radius: 6px;
  }
  .msg.ai .bubble {
    background: var(--ai-bubble); border: 1px solid var(--border);
    border-bottom-left-radius: 6px;
    box-shadow: 0 1px 4px rgba(0,0,0,.05);
  }
  .msg.ai .bubble.error {
    background: #fef2f2; border-color: #fecaca; color: var(--danger);
  }

  /* markdown 渲染样式 */
  .bubble strong { font-weight: 700; }
  .bubble code {
    background: #f3f4f6; border-radius: 4px; padding: 1px 5px;
    font-family: Consolas, Menlo, monospace; font-size: 13px;
  }
  .msg.user .bubble code { background: rgba(255,255,255,.22); }
  .bubble p { margin: 4px 0; }
  .bubble ul, .bubble ol { margin: 4px 0; padding-left: 22px; }
  .bubble li { margin: 3px 0; }
  .bubble h1, .bubble h2, .bubble h3 { margin: 8px 0 4px; font-size: 15px; }

  /* 正在输入动画 */
  .typing { display: inline-flex; gap: 5px; align-items: center; padding: 6px 2px; }
  .typing span {
    width: 8px; height: 8px; border-radius: 50%;
    background: #94a3b8; animation: blink 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,80%,100% { opacity: .25; transform: scale(.9); } 40% { opacity: 1; transform: scale(1); } }

  /* ===== 快捷问题 ===== */
  .suggest { max-width: 860px; margin: 0 auto 8px; display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    border: 1px solid #c7d2fe; background: #eef2ff; color: #4338ca;
    border-radius: 999px; padding: 6px 13px; font-size: 12.5px; cursor: pointer;
    transition: all .2s;
  }
  .chip:hover { background: #e0e7ff; transform: translateY(-1px); }

  /* ===== 底部输入 ===== */
  footer {
    border-top: 1px solid var(--border);
    background: #fff;
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
  }
  .input-wrap {
    max-width: 860px; margin: 0 auto;
    display: flex; align-items: flex-end; gap: 10px;
    border: 1px solid var(--border); border-radius: 16px;
    padding: 8px 10px; background: #f9fafb;
    transition: border-color .2s;
  }
  .input-wrap:focus-within { border-color: var(--primary); background: #fff; }
  textarea {
    flex: 1; border: none; outline: none; resize: none;
    background: transparent; font: inherit; font-size: 14.5px;
    max-height: 140px; min-height: 24px; line-height: 1.5;
    color: var(--text);
  }
  .send {
    width: 40px; height: 40px; border: none; border-radius: 12px; cursor: pointer;
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    color: #fff; font-size: 18px; display: flex; align-items: center; justify-content: center;
    transition: opacity .2s, transform .1s; flex-shrink: 0;
  }
  .send:hover { opacity: .9; }
  .send:active { transform: scale(.94); }
  .send:disabled { opacity: .5; cursor: not-allowed; }
  .hint { text-align: center; font-size: 11.5px; color: var(--muted); margin-top: 8px; }
  .hint span { margin: 0 6px; color: #d1d5db; }

  @media (max-width: 640px) {
    .bubble { max-width: 86%; }
    .brand p { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo">🤖</div>
    <div>
      <h1>企业智能 Agent 助手</h1>
      <p id="session-label">会话：加载中…</p>
    </div>
  </div>
  <div class="actions">
    <button class="btn" onclick="newSession()">🔄 新会话</button>
    <button class="btn" onclick="clearScreen()">🧹 清空</button>
  </div>
</header>

<main id="main">
  <div class="chat-wrap" id="chat"></div>
</main>

<div class="suggest" id="suggest">
  <span class="chip" data-q="查询员工编号1的信息">👤 查询员工</span>
  <span class="chip" data-q="公司的退款规则是什么">📋 退款规则</span>
  <span class="chip" data-q="企业版产品多少钱，包含哪些功能">💼 产品价格</span>
  <span class="chip" data-q="用 100*20+sqrt(16) 帮我算一下">🧮 帮我计算</span>
  <span class="chip" data-q="我们公司主要做什么产品">🏢 公司简介</span>
</div>

<footer>
  <div class="input-wrap">
    <textarea id="input" rows="1" placeholder="请输入你的问题，Enter 发送，Shift+Enter 换行…"></textarea>
    <button class="send" id="send" onclick="sendMessage()">➤</button>
  </div>
  <div class="hint">企业智能 Agent · 支持员工查询 / 知识库检索 / 数学计算 / 多轮记忆 <span>|</span> 由 LangChain + DeepSeek 驱动</div>
</footer>

<script>
  // ===== 会话管理 =====
  let sessionId = localStorage.getItem('agent_session') || ('u' + Date.now());
  localStorage.setItem('agent_session', sessionId);
  document.getElementById('session-label').textContent = '会话：' + sessionId;

  function newSession() {
    sessionId = 'u' + Date.now();
    localStorage.setItem('agent_session', sessionId);
    document.getElementById('session-label').textContent = '会话：' + sessionId;
    clearScreen();
  }

  // ===== 消息渲染 =====
  const chat = document.getElementById('chat');

  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function inline(s) {
    s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
    return s;
  }
  function renderMarkdown(text) {
    const lines = escapeHtml(text).split('\n');
    let html = '', inList = null;
    const close = () => { if (inList) { html += '</' + inList + '>'; inList = null; } };
    for (let line of lines) {
      line = line.trim();
      if (!line) { close(); continue; }
      const ol = line.match(/^\d+\.\s+(.*)$/);
      const ul = line.match(/^[-*]\s+(.*)$/);
      const h  = line.match(/^(#{1,3})\s+(.*)$/);
      if (ol) {
        if (inList !== 'ol') { close(); html += '<ol>'; inList = 'ol'; }
        html += '<li>' + inline(ol[1]) + '</li>'; continue;
      }
      if (ul) {
        if (inList !== 'ul') { close(); html += '<ul>'; inList = 'ul'; }
        html += '<li>' + inline(ul[1]) + '</li>'; continue;
      }
      if (h) {
        close(); html += '<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>'; continue;
      }
      close();
      html += '<p>' + inline(line) + '</p>';
    }
    close();
    return html;
  }

  function addMsg(role, content, isError) {
    const div = document.createElement('div');
    div.className = 'msg ' + (role === 'user' ? 'user' : 'ai');
    const avatar = role === 'user' ? '🙋' : '🤖';
    const cls = isError ? 'bubble error' : 'bubble';
    div.innerHTML = '<div class="avatar">' + avatar + '</div>' +
      '<div class="' + cls + '">' +
      (role === 'user' ? escapeHtml(content) : renderMarkdown(content)) +
      '</div>';
    chat.appendChild(div);
    scrollBottom();
    return div;
  }

  function addTyping() {
    const div = document.createElement('div');
    div.className = 'msg ai';
    div.innerHTML = '<div class="avatar">🤖</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
    chat.appendChild(div);
    scrollBottom();
    return div;
  }

  function scrollBottom() {
    const main = document.getElementById('main');
    main.scrollTop = main.scrollHeight;
  }

  function clearScreen() { chat.innerHTML = ''; }

  // ===== 发送逻辑 =====
  let busy = false;
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');

  async function sendMessage() {
    const text = input.value.trim();
    if (!text || busy) return;
    input.value = '';
    autoResize();

    addMsg('user', text);
    const typing = addTyping();
    setBusy(true);

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, session_id: sessionId })
      });
      const data = await res.json();
      typing.remove();
      if (data.error) {
        addMsg('ai', '请求出错：' + data.error, true);
      } else {
        addMsg('ai', data.answer || '（无回答）');
      }
    } catch (err) {
      typing.remove();
      addMsg('ai', '网络错误：' + err.message, true);
    } finally {
      setBusy(false);
    }
  }

  function setBusy(b) {
    busy = b;
    sendBtn.disabled = b;
  }

  // ===== 输入框交互 =====
  function autoResize() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  }
  input.addEventListener('input', autoResize);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  // ===== 快捷问题 =====
  document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      input.value = chip.dataset.q;
      autoResize();
      input.focus();
    });
  });

  // 初始问候
  addMsg('ai', '你好！我是**企业智能 Agent 助手** 👋\n\n我可以帮你：\n- 查询员工信息\n- 查询企业知识库\n- 执行数学计算\n\n直接输入问题，或点击上方快捷问题试试吧。');
  input.focus();
</script>
</body>
</html>
